[project]
name = "mobile-visual-rag"
version = "0.1.0"
description = "Mobile-First Natural Language Photo & Video Visual RAG with Multi-Architecture Benchmarking and RLAIF Validation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "numpy>=1.26,<2.3",
    "transformers>=4.49.0",
    "open-clip-torch>=2.29.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.20.0",
    "onnxscript>=0.1.0",
    "faiss-cpu>=1.9.0",
    "hnswlib>=0.8.0",
    "rank-bm25>=0.2.2",
    "streamlit>=1.40.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "opencv-python-headless>=4.10.0",
    "timm>=1.0.11",
    "accelerate>=1.2.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "pillow>=11.0.0",
    "huggingface_hub>=0.26.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
    "qwen-vl-utils>=0.0.8",
    "num2words>=0.5.13",
    "requests>=2.32.0",
]
