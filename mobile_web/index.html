<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F172A" />
  <title>PocketLens — Mobile Visual RAG</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563EB' stroke-width='2.2'%3E%3Ccircle cx='11' cy='11' r='8'/%3E%3Cpath d='m21 21-4.3-4.3'/%3E%3C/svg%3E" />
  <!-- Commercially usable SIL OFL 1.1 Fonts: Pretendard & Inter -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <style>
    :root {
      /* Material Design 3 + Apple HIG hybrid dark/light Adaptive Tokens */
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --surface-container: #F1F5F9;
      --surface-elevated: rgba(255, 255, 255, 0.86);
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #64748B;
      --accent: #2563EB;
      --accent-soft: #DBEAFE;
      --accent-text: #1D4ED8;
      --border: #E2E8F0;
      --success: #059669;
      --badge-video: #7C3AED;
      --radius-pill: 9999px;
      --radius-card: 18px;
      --shadow-sm: 0 2px 10px rgba(15, 23, 42, 0.06);
      --shadow-lg: 0 18px 40px rgba(15, 23, 42, 0.14);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090D16;
        --surface: #111827;
        --surface-container: #1E293B;
        --surface-elevated: rgba(17, 24, 39, 0.86);
        --text-primary: #F8FAFC;
        --text-secondary: #CBD5E1;
        --text-muted: #94A3B8;
        --accent: #60A5FA;
        --accent-soft: rgba(59, 130, 246, 0.18);
        --accent-text: #93C5FD;
        --border: #1F2937;
        --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.35);
        --shadow-lg: 0 18px 44px rgba(0, 0, 0, 0.55);
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: "Pretendard", "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, rgba(37, 99, 235, 0.09), transparent 45%), var(--bg);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .phone-shell {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      padding-bottom: 84px;
      box-shadow: var(--shadow-lg);
    }

    @media (min-width: 520px) {
      .phone-shell {
        margin: 18px 0;
        min-height: calc(100vh - 36px);
        border-radius: 34px;
        border: 1px solid var(--border);
        overflow: hidden;
      }
    }

    /* Apple HIG Translucent Header */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: var(--surface-elevated);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 12px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .brand-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      background: var(--accent-soft);
      color: var(--accent-text);
    }

    /* Material Design 3 Contained Search Bar + Fluent 2 Adaptive Clear */
    .search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface-container);
      border: 1.5px solid transparent;
      border-radius: var(--radius-pill);
      padding: 10px 14px;
      transition: border-color 0.18s ease, background 0.18s ease;
    }

    .search-bar:focus-within {
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .search-bar input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 15px;
      font-family: inherit;
    }

    .icon-btn {
      background: none;
      border: none;
      padding: 4px;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .icon-btn:hover { background: rgba(148, 163, 184, 0.15); color: var(--text-primary); }

    /* Apple HIG Scope Bars + M3 Filter Chips */
    .chips-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 16px 4px;
      scrollbar-width: none;
    }
    .chips-row::-webkit-scrollbar { display: none; }

    .chip {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }

    /* Visual RAG Decomposition & Grounded Answer Card */
    .rag-card {
      margin: 10px 16px 4px;
      padding: 14px;
      border-radius: var(--radius-card);
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .rag-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .meta-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 8px;
      background: var(--surface-container);
      color: var(--text-secondary);
    }

    .rag-answer {
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--text-primary);
      margin: 0;
    }

    /* Quick Discovery Suggestions (Empty / Pre-Search State per HIG & Fluent 2) */
    .section-title {
      padding: 12px 16px 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 16px 10px;
    }

    .suggest-pill {
      font-size: 12.5px;
      padding: 7px 12px;
      border-radius: var(--radius-pill);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      cursor: pointer;
    }

    /* Mobile Photo & Video Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 8px 16px 16px;
    }

    .media-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.14s ease;
    }

    .media-card:active { transform: scale(0.975); }

    .thumb-wrap {
      position: relative;
      aspect-ratio: 4 / 3;
      background: var(--surface-container);
      overflow: hidden;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .score-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(15, 23, 42, 0.78);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 8px;
      backdrop-filter: blur(6px);
    }

    .video-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(124, 58, 237, 0.9);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .card-body {
      padding: 9px 10px 10px;
    }

    .card-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .card-sub {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Apple HIG Bottom Tab Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 440px;
      height: 66px;
      background: var(--surface-elevated);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
      z-index: 25;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
    }

    .nav-item.active { color: var(--accent); }

    /* Detail Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.72);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }

    .modal-backdrop.open { display: flex; }

    .modal-sheet {
      width: 100%;
      max-width: 440px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--surface);
      border-radius: 24px 24px 0 0;
      padding: 16px;
      box-shadow: var(--shadow-lg);
    }

    .modal-media {
      width: 100%;
      max-height: 300px;
      border-radius: 14px;
      object-fit: contain;
      background: #000;
    }

    .credit-box {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--surface-container);
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="phone-shell">
    <header class="top-bar">
      <div class="brand-row">
        <div class="brand-title">
          <!-- Lucide Sparkles Icon (ISC/MIT) -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)">
            <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
          </svg>
          PocketLens RAG
        </div>
        <span class="brand-pill" id="engineBadge">On-Device INT8</span>
      </div>

      <div class="search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-muted)">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input id="queryInput" type="search" placeholder="예: 해변 노을 사진, 점프하는 고양이 동영상..." autocomplete="off" />
        <button id="clearBtn" class="icon-btn" title="Clear" style="display:none">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="chips-row" id="filterChips">
      <button class="chip active" data-filter="all">전체</button>
      <button class="chip" data-filter="image">사진만</button>
      <button class="chip" data-filter="video">동영상만</button>
      <button class="chip active" data-rag="R4_adaptive_rlaif_rag">RLAIF Hybrid RAG</button>
      <button class="chip" data-rag="R0_direct_dense">Direct INT8</button>
    </div>

    <div id="ragCard" class="rag-card" style="display:none;">
      <div class="rag-meta" id="ragMeta"></div>
      <p class="rag-answer" id="ragAnswer"></p>
    </div>

    <div class="section-title" id="sectionTitle">추천 자연어 검색어</div>
    <div class="suggestions" id="suggestionsRow">
      <button class="suggest-pill" data-q="지난 주말에 찍은 강아지 사진 찾아줘">🐶 강아지 사진</button>
      <button class="suggest-pill" data-q="물웅덩이에서 물 마시는 고양이 동영상 보여줘">🐱 물 마시는 고양이 영상</button>
      <button class="suggest-pill" data-q="따뜻한 카페 라떼 커피 사진">☕ 커피 라떼</button>
      <button class="suggest-pill" data-q="밤거리 야경 동영상">🌃 밤거리 영상</button>
      <button class="suggest-pill" data-q="우주에서 본 지구 사진">🌍 우주 지구</button>
      <button class="suggest-pill" data-q="bicycle and car on street video">🚲 도로 자전거/차량</button>
    </div>

    <div class="grid" id="resultsGrid"></div>

    <nav class="bottom-nav">
      <button class="nav-item active" id="tabSearch">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        검색
      </button>
      <button class="nav-item" id="tabGallery">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
        </svg>
        라이브러리
      </button>
      <button class="nav-item" id="tabInfo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
        </svg>
        크레딧/성능
      </button>
    </nav>
  </div>

  <div class="modal-backdrop" id="detailModal">
    <div class="modal-sheet">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <strong id="modalTitle" style="font-size:15px;">미디어 상세</strong>
        <button id="closeModal" class="icon-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>
      <div id="modalMediaHost"></div>
      <div id="modalCaption" style="margin-top:10px;font-size:13px;line-height:1.5;color:var(--text-primary);"></div>
      <div id="modalCredit" class="credit-box"></div>
    </div>
  </div>

  <script>
    const input = document.getElementById("queryInput");
    const clearBtn = document.getElementById("clearBtn");
    const grid = document.getElementById("resultsGrid");
    const ragCard = document.getElementById("ragCard");
    const ragMeta = document.getElementById("ragMeta");
    const ragAnswer = document.getElementById("ragAnswer");
    const sectionTitle = document.getElementById("sectionTitle");
    const modal = document.getElementById("detailModal");
    let mediaFilter = "all";
    let ragMode = "R4_adaptive_rlaif_rag";
    let debounceTimer = null;
    let currentItems = [];

    async function runSearch(q) {
      const url = `/api/search?q=${encodeURIComponent(q)}&media_type=${mediaFilter}&rag=${ragMode}&top_k=12`;
      const res = await fetch(url);
      const data = await res.json();
      renderResults(data);
    }

    async function loadGallery() {
      const res = await fetch(`/api/gallery?media_type=${mediaFilter}`);
      const data = await res.json();
      ragCard.style.display = "none";
      sectionTitle.textContent = `검증된 오픈 라이선스 갤러리 (${data.items.length}개)`;
      renderGrid(data.items, false);
    }

    function renderResults(data) {
      if (data.rag_summary) {
        ragCard.style.display = "block";
        ragMeta.innerHTML = `
          <span class="meta-tag">전처리: ${data.preprocessing.core_text}</span>
          <span class="meta-tag">필터: ${data.preprocessing.media_type_filter || "전체"}</span>
          <span class="meta-tag">지연: ${data.latency_ms.toFixed(1)} ms</span>
          <span class="meta-tag">모드: ${data.rag_mode}</span>
        `;
        ragAnswer.textContent = data.rag_summary;
      } else {
        ragCard.style.display = "none";
      }
      sectionTitle.textContent = `검색 결과 (${data.results.length}건)`;
      renderGrid(data.results, true);
    }

    function renderGrid(items, showScore) {
      currentItems = items;
      grid.innerHTML = items.map((item, idx) => `
        <div class="media-card" data-item-idx="${idx}">
          <div class="thumb-wrap">
            <img src="${item.thumb_url}" alt="${item.title}" loading="lazy" />
            ${showScore ? `<span class="score-badge">#${idx + 1} · ${(item.score * 100).toFixed(0)}%</span>` : ""}
            ${item.media_type === "video" ? `<span class="video-badge">▶ ${item.timestamp_sec != null ? item.timestamp_sec.toFixed(1) + "s" : (item.duration_sec + "s")}</span>` : ""}
          </div>
          <div class="card-body">
            <div class="card-title">${item.title}</div>
            <div class="card-sub">${item.license_short} · ${item.author}</div>
          </div>
        </div>
      `).join("");
      grid.querySelectorAll(".media-card").forEach((card) => {
        card.onclick = () => {
          const item = currentItems[Number(card.dataset.itemIdx)];
          if (item) openDetail(item);
        };
      });
    }

    function openDetail(item) {
      document.getElementById("modalTitle").textContent = item.title;
      const host = document.getElementById("modalMediaHost");
      if (item.media_type === "video") {
        const startT = item.timestamp_sec ? `#t=${Math.max(0, item.timestamp_sec - 0.5)}` : "";
        host.innerHTML = `<video class="modal-media" controls autoplay muted playsinline src="${item.media_url}${startT}"></video>`;
      } else {
        host.innerHTML = `<img class="modal-media" src="${item.media_url}" alt="${item.title}" />`;
      }
      document.getElementById("modalCaption").textContent = item.caption || item.description || "";
      document.getElementById("modalCredit").innerHTML = `
        <strong>저작자(Credit):</strong> ${item.author}<br/>
        <strong>라이선스:</strong> <a href="${item.license_url}" target="_blank" rel="noopener">${item.license_short}</a> (상업적 이용 가능)<br/>
        <strong>출처:</strong> <a href="${item.source_page_url}" target="_blank" rel="noopener">${item.source_platform}</a>
      `;
      modal.classList.add("open");
    }

    document.getElementById("closeModal").onclick = () => {
      modal.classList.remove("open");
      document.getElementById("modalMediaHost").innerHTML = "";
    };
    modal.onclick = (e) => { if (e.target === modal) document.getElementById("closeModal").click(); };

    input.addEventListener("input", () => {
      clearBtn.style.display = input.value ? "inline-flex" : "none";
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        if (input.value.trim()) runSearch(input.value.trim());
        else loadGallery();
      }, 280);
    });

    clearBtn.onclick = () => {
      input.value = "";
      clearBtn.style.display = "none";
      loadGallery();
    };

    document.querySelectorAll(".suggest-pill").forEach((btn) => {
      btn.onclick = () => {
        input.value = btn.dataset.q;
        clearBtn.style.display = "inline-flex";
        runSearch(btn.dataset.q);
      };
    });

    document.querySelectorAll(".chip[data-filter]").forEach((ch) => {
      ch.onclick = () => {
        document.querySelectorAll(".chip[data-filter]").forEach((c) => c.classList.remove("active"));
        ch.classList.add("active");
        mediaFilter = ch.dataset.filter;
        if (input.value.trim()) runSearch(input.value.trim());
        else loadGallery();
      };
    });

    document.querySelectorAll(".chip[data-rag]").forEach((ch) => {
      ch.onclick = () => {
        document.querySelectorAll(".chip[data-rag]").forEach((c) => c.classList.remove("active"));
        ch.classList.add("active");
        ragMode = ch.dataset.rag;
        document.getElementById("engineBadge").textContent = ragMode === "R0_direct_dense" ? "Direct INT8" : "RLAIF Hybrid";
        if (input.value.trim()) runSearch(input.value.trim());
      };
    });

    document.getElementById("tabGallery").onclick = () => { input.value = ""; loadGallery(); };
    document.getElementById("tabSearch").onclick = () => { input.focus(); };
    document.getElementById("tabInfo").onclick = async () => {
      const res = await fetch("/api/stats");
      const s = await res.json();
      ragCard.style.display = "block";
      ragMeta.innerHTML = `<span class="meta-tag">모바일 번들: ${s.bundle_mb} MB</span><span class="meta-tag">ONNX INT8 모델: ${s.model_mb} MB</span>`;
      ragAnswer.textContent = `검증된 사진 ${s.n_images}장, 영상 ${s.n_videos}편(키프레임 ${s.n_keyframes}개)이 상업적 이용 가능 라이선스(CC0/PD/CC-BY)로 2중 팩트체크되었습니다.`;
    };

    loadGallery();
  </script>
</body>
